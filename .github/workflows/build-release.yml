name: Build Cross-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: HartRateMonitor-Windows.exe
            build_cmd: pyinstaller --noconfirm --onefile --windowed --name "HartRateMonitor" --collect-all bleak client.py
            dist_path: client/dist/HartRateMonitor.exe

          - os: ubuntu-latest
            artifact_name: HartRateMonitor-Linux
            build_cmd: pyinstaller --noconfirm --onefile --name "HartRateMonitor" --collect-all bleak client.py
            dist_path: client/dist/HartRateMonitor

          - os: macos-latest
            artifact_name: HartRateMonitor-macOS.zip
            build_cmd: |
              pyinstaller --noconfirm --windowed --name "HartRateMonitor" --collect-all bleak --osx-bundle-identifier "com.coospo.h6monitor" client.py
              cd dist && zip -r HartRateMonitor-macOS.zip HartRateMonitor.app
            dist_path: client/dist/HartRateMonitor-macOS.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: client
        run: ${{ matrix.build_cmd }}

      - name: Rename artifact
        run: mv ${{ matrix.dist_path }} ${{ matrix.artifact_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
