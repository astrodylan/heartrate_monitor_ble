name: Build Cross-Platform Releases & Manual

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a version tag (e.g., v1.0.0)
  workflow_dispatch: # Allows manual test runs from the GitHub Actions tab

permissions:
  contents: write

jobs:
  # Job 1: Build Windows, Linux, and macOS apps
  build-app:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: HartRateMonitor-Windows.exe
            build_cmd: pyinstaller --noconfirm --onefile --windowed --name "HartRateMonitor" --collect-all bleak client.py
            dist_path: client/dist/HartRateMonitor.exe

          - os: ubuntu-latest
            artifact_name: HartRateMonitor-Linux
            build_cmd: pyinstaller --noconfirm --onefile --name "HartRateMonitor" --collect-all bleak client.py
            dist_path: client/dist/HartRateMonitor

          - os: macos-latest
            artifact_name: HartRateMonitor-macOS.zip
            build_cmd: |
              pyinstaller --noconfirm --windowed --name "HartRateMonitor" --collect-all bleak --osx-bundle-identifier "com.coospo.h6monitor" client.py
              cd dist && zip -r HartRateMonitor-macOS.zip HartRateMonitor.app
            dist_path: client/dist/HartRateMonitor-macOS.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: client
        run: ${{ matrix.build_cmd }}

      - name: Rename artifact
        run: mv ${{ matrix.dist_path }} ${{ matrix.artifact_name }}

      - name: Upload app artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # Job 2: Build the PDF Manual
  build-manual:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Markdown files for PDF
        run: |
          awk 'FNR==1 && NR!=1 {print "\n"} {print}' docs/manual/[0-9]*.md > docs/manual/pdf.md
          sed -i '/^\[Next:/d' docs/manual/pdf.md

      - name: Generate PDF Manual
        uses: docker://pandoc/extra:latest
        with:
          args: >
            docs/manual/pdf.md
            -o HeartrateMonitor-Manual.pdf
            --resource-path=docs/manual
            --pdf-engine=weasyprint
            --toc
            --toc-depth=2
            --number-sections
            --metadata title="HeartRateMonitor User Manual"
            --metadata date="${{ github.ref_name }}"


      - name: Upload manual artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: App-Manual.pdf
          path: App-Manual.pdf

  # Job 3: Wait for all builds to finish, then publish one clean Release
  publish-release:
    needs: [build-app, build-manual]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
